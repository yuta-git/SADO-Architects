    <main class="l-main">
      <section class="p-contact-page">
        <div class="p-contact-page__inner l-container">
          <h1 class="p-contact-page__heading">CONTACT</h1>

          <form class="p-contact-page__form" action="#" method="post" novalidate>

            <div class="p-contact-page__field">
              <label class="p-contact-page__label" for="name">
                氏名<span class="p-contact-page__required" aria-hidden="true">*</span>
              </label>
              <input
                class="p-contact-page__input"
                type="text"
                id="name"
                name="name"
                placeholder="佐渡 太郎"
                required
              />
            </div>

            <div class="p-contact-page__field">
              <label class="p-contact-page__label" for="email">
                メールアドレス<span class="p-contact-page__required" aria-hidden="true">*</span>
              </label>
              <input
                class="p-contact-page__input"
                type="email"
                id="email"
                name="email"
                placeholder="sado@xxxxx.co.jp"
                required
              />
            </div>

            <div class="p-contact-page__field">
              <label class="p-contact-page__label" for="tel">電話番号</label>
              <input
                class="p-contact-page__input"
                type="tel"
                id="tel"
                name="tel"
                placeholder="012-3456-7890"
              />
            </div>

            <div class="p-contact-page__field">
              <label class="p-contact-page__label" for="message">
                お問い合わせ<span class="p-contact-page__required" aria-hidden="true">*</span>
              </label>
              <textarea
                class="p-contact-page__textarea"
                id="message"
                name="message"
                placeholder="お問い合わせ内容をお書きください。"
                required
              ></textarea>
            </div>

            <p class="p-contact-page__note">※ は必須項目です。</p>

            <div class="p-contact-page__submit">
              <button type="submit" class="p-contact-page__btn">SEND</button>
            </div>

          </form>
        </div>
      </section>
    </main>

    <!-- Page top button -->
    <button
      class="c-page-top js-page-top"
      aria-label="ページの先頭へ戻る"
    ></button>
